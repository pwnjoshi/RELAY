version: 1
frontend:
  phases:
    preBuild:
      commands:
        - env | grep -E '^(CALLE_|JWT_|NEXT_PUBLIC_|NEBIUS_|DEMO_MODE|NODE_ENV)' > .env.production
        - npm ci --include=dev
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
