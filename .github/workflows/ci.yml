name: RELAY Production CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Lint, Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci --include=dev

      - name: Run ESLint
        run: npm run lint

      - name: Run Next.js Production Build
        run: npm run build
        env:
          JWT_SECRET: relay-ci-pipeline-secure-test-secret-key-32-chars-minimum
          CALLE_API_KEY: ci_mock_calle_key
          AWS_REGION: us-east-1

      - name: Run Automated Verification Tests
        run: npm test
        env:
          JWT_SECRET: relay-ci-pipeline-secure-test-secret-key-32-chars-minimum
